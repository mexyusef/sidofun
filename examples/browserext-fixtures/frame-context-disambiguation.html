<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frame Context Disambiguation Fixture</title>
    <style>
      body { font-family: sans-serif; margin: 24px; }
      main { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      iframe { width: 100%; height: 340px; border: 1px solid #444; border-radius: 12px; }
    </style>
  </head>
  <body>
    <h1>Frame Context Disambiguation Fixture</h1>
    <p>Two same-origin auth frames intentionally expose overlapping login/signup labels so browserext can use frame-query and context-query together.</p>
    <main>
      <iframe
        name="auth-login-frame"
        title="Embedded auth login frame"
        srcdoc='
          <!doctype html>
          <html>
          <body>
            <form id="frame-login-form" action="#frame-login">
              <h2>Frame Account Login Form</h2>
              <label>Email address <input name="frame_login_email" type="email" placeholder="frame login email"></label>
              <label>Password <input name="frame_login_password" type="password" placeholder="frame login password"></label>
              <button type="submit">Sign in to frame account</button>
            </form>
            <pre id="result">No submission yet.</pre>
            <script>
              document.querySelector(\"#frame-login-form\").addEventListener(\"submit\", (event) => {
                event.preventDefault();
                const data = Object.fromEntries(new FormData(event.currentTarget).entries());
                document.querySelector(\"#result\").textContent = JSON.stringify({ form: \"frame-login-form\", data }, null, 2);
              });
            </script>
          </body>
          </html>'></iframe>
      <iframe
        name="auth-signup-frame"
        title="Embedded auth signup frame"
        srcdoc='
          <!doctype html>
          <html>
          <body>
            <form id="frame-signup-form" action="#frame-signup">
              <h2>Frame Account Signup Form</h2>
              <label>Full name <input name="frame_signup_name" type="text" placeholder="frame signup name"></label>
              <label>Email address <input name="frame_signup_email" type="email" placeholder="frame signup email"></label>
              <label>Password <input name="frame_signup_password" type="password" placeholder="frame signup password"></label>
              <button type="submit">Create frame account</button>
            </form>
            <pre id="result">No submission yet.</pre>
            <script>
              document.querySelector(\"#frame-signup-form\").addEventListener(\"submit\", (event) => {
                event.preventDefault();
                const data = Object.fromEntries(new FormData(event.currentTarget).entries());
                document.querySelector(\"#result\").textContent = JSON.stringify({ form: \"frame-signup-form\", data }, null, 2);
              });
            </script>
          </body>
          </html>'></iframe>
    </main>
  </body>
</html>
