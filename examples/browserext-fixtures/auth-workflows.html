<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sidofun Browserext Auth Fixture</title>
    <style>
      body { font-family: sans-serif; margin: 24px; display: grid; gap: 24px; }
      section { border: 1px solid #ddd; padding: 16px; max-width: 560px; }
      form { display: grid; gap: 12px; }
      label { display: grid; gap: 6px; }
      pre { white-space: pre-wrap; background: #fafafa; border: 1px solid #eee; padding: 12px; }
    </style>
  </head>
  <body>
    <section>
      <h1>Login Fixture</h1>
      <form id="login-form">
        <label>
          Email address
          <input id="login-email" name="email" type="email" autocomplete="username" />
        </label>
        <label>
          Password
          <input id="login-password" name="password" type="password" autocomplete="current-password" />
        </label>
        <button id="login-submit" type="submit">Sign in</button>
      </form>
      <pre id="login-result">No login submission yet.</pre>
    </section>

    <section>
      <h1>Signup Fixture</h1>
      <form id="signup-form">
        <label>
          Full name
          <input id="signup-name" name="fullName" type="text" autocomplete="name" />
        </label>
        <label>
          Email
          <input id="signup-email" name="email" type="email" autocomplete="email" />
        </label>
        <label>
          Create password
          <input id="signup-password" name="password" type="password" autocomplete="new-password" />
        </label>
        <label>
          Confirm password
          <input id="signup-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" />
        </label>
        <button id="signup-submit" type="submit">Create account</button>
      </form>
      <pre id="signup-result">No signup submission yet.</pre>
    </section>

    <script>
      const readForm = (form) => Object.fromEntries(new FormData(form).entries());

      document.getElementById('login-form').addEventListener('submit', (event) => {
        event.preventDefault();
        document.getElementById('login-result').textContent = JSON.stringify(readForm(event.currentTarget), null, 2);
      });

      document.getElementById('signup-form').addEventListener('submit', (event) => {
        event.preventDefault();
        document.getElementById('signup-result').textContent = JSON.stringify(readForm(event.currentTarget), null, 2);
      });
    </script>
  </body>
</html>
